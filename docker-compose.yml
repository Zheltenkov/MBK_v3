services:
  backend:
    build: .
    container_name: mbk-backend
    restart: unless-stopped
    env_file: .env
    expose:
      - "8000"
    # Порт наружу пробрасываем только в dev (раскомментируй для отладки):
    # ports:
    #   - "8000:8000"
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build: ./frontend
    container_name: mbk-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${MBK_PORT:-80}:80"
