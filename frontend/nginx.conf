server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    auth_basic "MBK assistant";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # SPA fallback: всё, что не файл — index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Прокси к FastAPI (docker compose service "backend" на порту 8000)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # === КРИТИЧНО для SSE ===
        proxy_set_header Connection '';                # отключаем keepalive чанкинг
        proxy_buffering off;                            # не накапливаем — отдаём чанки сразу
        proxy_cache off;
        proxy_read_timeout 24h;                         # SSE-сессии долгие, не дропаем
        proxy_send_timeout 24h;
        chunked_transfer_encoding on;
    }

    # gzip отключён для /api (SSE), включён для статики
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_proxied any;

    # Кеширование статики
    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
